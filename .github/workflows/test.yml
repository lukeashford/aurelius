name: Tests

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-root:
    name: Test Root Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  test-demo:
    name: Test Demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build root package
        run: npm run build

      - name: Pack root package
        id: pack
        run: echo "tarball=$(npm pack)" >> $GITHUB_OUTPUT

      - name: Install demo dependencies
        working-directory: ./demo
        run: npm ci

      - name: Install packed aurelius tarball in demo
        working-directory: ./demo
        run: npm install ../${{ steps.pack.outputs.tarball }} --legacy-peer-deps --no-save

      - name: Lint demo
        working-directory: ./demo
        run: npm run lint

      - name: Run unit tests
        working-directory: ./demo
        run: npm test -- --ci --coverage --maxWorkers=2

      - name: Build demo
        working-directory: ./demo
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: ./demo
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./demo
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: demo/playwright-report/
          retention-days: 30

      - name: Upload Playwright Snapshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-snapshots
          path: demo/e2e/**/*-snapshots/
          retention-days: 30

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [ test-root, test-demo ]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-root.result }}" != "success" ] || [ "${{ needs.test-demo.result }}" != "success" ]; then
            echo "Tests failed! Check the logs above."
            exit 1
          fi
          echo "✅ All tests passed on React 19!"
